# The tools that fire by themselves on a pull request (AGENTS.md, the stage table). Apart from ci.yml so that
# "Check, test, build and play", a required check, is untouched. Neither job writes to the repository.
name: Pull request triggers

on:
  # `edited`: the body is read, so a fixed body re-runs the check without a push
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: triggers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body:
    name: The body names the quest review, the story review, the picture's source and the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # a quest file changed -> "Quest review:" (quest-designer skill); a story file changed -> "Story review:"
      # (story-keeper skill); a picture added under content/kit -> "Source:" (docs/art/PROP_FROM_REF.md); every pull
      # request -> "Tree:" (AGENTS.md, "Tree first, both ways").
      # The body goes in through the environment, never into the script.
      - name: Read the changed files and the body
        env:
          BASE: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          git diff --name-status "origin/$BASE...HEAD" | pnpm --silent exec tsx tools/src/pr-rules-cli.ts | tee triggers.txt
      - name: Report
        if: always()
        run: |
          [ -f triggers.txt ] || exit 0
          { echo '### Quest review, story review, picture source and tree'; echo '```'; cat triggers.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  streams:
    name: The other open streams (informs, never fails)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # a failure here is a note on the run, not a red pull request
    continue-on-error: true
    steps:
      # every branch's tip is needed for the collision check, so the whole history comes down
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # reads refs and the open pull requests (gh, with the run's read-only token); its one write, `git fetch`, is skipped
      - name: pnpm streams
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          pnpm --silent streams --no-fetch | tee streams.txt
      - name: Report
        if: always()
        run: |
          [ -f streams.txt ] || exit 0
          { echo '### pnpm streams'; echo '```'; cat streams.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
