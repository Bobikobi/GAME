name: CI

on:
  # every pull request runs the job, docs-only included: "Check, test, build and play" is a required
  # check on main and develop, and a path filter here would leave it "Expected" and block the merge
  # (docs/team/PLATFORM.md 9.2). A push of prose only still runs no build.
  pull_request:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # schemas, content, lint, types, unit tests, the build and the database: about 2.5 minutes green
  checks:
    name: Check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    # the base the checks against develop compare with (tools/src/decisions/base.ts): on a pull request
    # the checkout is the merge commit, so HEAD^1 is the tip of the base branch; a push has no base
    env:
      DECISIONS_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'skip' }}
    # the game's database as it will run on the owner's box: postgres 16, its own user and database.
    # No production database exists yet (NEXT 18 b); this one is created for the run and thrown away.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: game
          POSTGRES_DB: game
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # pull requests go into develop (releases: develop into main); a pull request
      # stacked on another branch lands there, not in develop (AGENTS.md, "How work moves")
      - name: The pull request targets develop or main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE" in
            develop|main) echo "base: $BASE" ;;
            *)
              echo "::error::This pull request targets '$BASE'. Pull requests go into develop (a release is develop into main). Stacked on another branch it would land there, not in develop."
              exit 1 ;;
          esac

      # the whole history: HEAD^1 is the base, and next-status finds a "built (#n)" pull request in the log
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # the creators board a branch commits (`pnpm board --base origin/develop`) must be the one develop gets when
      # the pull request lands as one commit: a stale copy or a number written by hand fails here, before it reaches
      # the site. HEAD^1 is the base (above). A release into main is not checked: the board follows develop.
      - name: The creators board equals the merged history
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: pnpm board --verify --base HEAD^1

      # the same report a creator gets from `pnpm check`, also shown on the run's summary page
      - name: Content check
        run: |
          set -o pipefail
          pnpm --silent check | tee check.txt
      - name: Content check report
        if: always()
        run: |
          [ -f check.txt ] || exit 0
          { echo '### pnpm check'; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Schemas, content, lint, types, tests and build
        run: pnpm verify

      # the database tests are skipped by `pnpm verify` above (no DATABASE_URL), and run here against a
      # real postgres: the migrations apply twice without a second change, and the store's lock holds
      # (and sign-in: a link spent once under a race, a closed account leaving no row)
      - name: Database migrations against postgres 16
        env:
          DATABASE_URL: postgres://game:game@localhost:5432/game
        run: |
          pnpm db:migrate
          pnpm exec vitest run server/test/db.test.ts server/test/signin-db.test.ts

      # the simulated player (NEXT 18 g): a starter's whole opening, the first outing and the first sale
      # through the real HTTP API against postgres, then the same log replayed on the laptop, byte for
      # byte; and only a log that replays is posted to a board. The clock is the API's own `now` seam.
      - name: The simulated player and the verified boards against postgres 16
        env:
          DATABASE_URL: postgres://game:game@localhost:5432/game
        run: pnpm exec vitest run server/test/sim.test.ts server/test/boards.test.ts

  # the groups of browser tests and each one's timeout, read from game/e2e/run.ts so a group added
  # there is played here without a change to this file (plain node 24 runs it: it imports only node)
  e2e-groups:
    name: The browser test groups
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: game/e2e
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: list
        run: echo "groups=$(node game/e2e/run.ts --list)" >> "$GITHUB_OUTPUT"

  # the browser tests, one job per group beside the checks: the run lasts as long as the phone opening,
  # not the sum of every script. A script that fails is played once more alone (game/e2e/run.ts), and
  # the screenshots of its first attempt are kept, so a flake on a slow runner (issue #25) costs one
  # script and stays visible and countable.
  e2e:
    name: Play in Chrome (${{ matrix.group }})
    needs: e2e-groups
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # what the scripts serve: the bundle, game/dist and the optional 3D door in game/dist-3d
      - name: Build the game
        run: |
          pnpm bundle
          pnpm --filter game build
          pnpm exec tsx tools/src/site/build-3d.ts
      - name: Play ${{ matrix.group }}
        run: pnpm e2e:group "${{ matrix.group }}" e2e-shots --retry
      - name: Keep the screenshots of a failed first attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-attempt1-${{ matrix.group }}
          path: e2e-shots-attempt1/
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-${{ matrix.group }}
          path: e2e-shots/
          if-no-files-found: ignore
          retention-days: 14

  # the required check, by this exact name: branch protection on main and develop and the landing
  # scripts read it. Green only when every job above passed; a failed, skipped or cancelled one fails it.
  verify:
    name: Check, test, build and play
    needs: [checks, e2e-groups, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length == 3 and all(.[]; .result == "success")' > /dev/null
