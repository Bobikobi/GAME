name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, build and play
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # the same report a creator gets from `pnpm check`, also shown on the run's summary page
      - name: Content check
        run: |
          set -o pipefail
          pnpm --silent check | tee check.txt
      - name: Content check report
        if: always()
        run: |
          [ -f check.txt ] || exit 0
          { echo '### pnpm check'; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Schemas, content, lint, types, tests and build
        run: pnpm verify

      - name: Play the opening in Chrome, on a phone screen and a desktop
        run: pnpm e2e e2e-shots
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: ignore
          retention-days: 14
