# Runs the community request, proposal, vote, summary, and credits loop.
name: Community loop

on:
  schedule:
    # hourly: the repository is public, so Actions minutes are free, and the hub-data refresh below runs on it
    - cron: '23 * * * *'
    - cron: '7 7 * * 1'
  workflow_dispatch:
    inputs:
      command:
        description: Loop command to run
        required: true
        default: all
        type: choice
        options:
          - all
          - requests
          - proposals
          - votes
          - discovery
          - summary
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]

permissions: {}

jobs:
  loop:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # one run at a time, since every run rewrites the same comments and labels; the weekly summary
    # gets its own group, so a burst of pull request events cannot replace it while it waits
    concurrency:
      group: ${{ github.event.schedule == '7 7 * * 1' && 'loop-summary' || 'loop' }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      # SECURITY: pull_request_target checks out the default branch, never the PR head, and no PR code is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the community loop
        # event values go through env, never straight into the script
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          COMMAND: ${{ inputs.command }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "23 * * * *" ]; then
            pnpm loop all
          elif [ "$EVENT" = "schedule" ]; then
            pnpm loop summary --post
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            pnpm loop "$COMMAND"
          else
            pnpm loop proposals
          fi

  # The hourly refresh (docs/team/GRUNT.md item 14, PLATFORM.md 3.4): rebuild hub-data as a production build
  # would, compare it with the deployed one, and fire the Vercel deploy hook only when the data differs. Its own
  # job and concurrency group, so a burst of pull request events in the loop group can never replace it.
  # The read-only Redis token gives the same usage counts production has; without it every run would differ.
  refresh:
    if: (github.event_name == 'schedule' && github.event.schedule == '23 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.command == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: hub-refresh
      cancel-in-progress: false
    permissions:
      contents: read
    # only whether the deploy hook exists, so the steps show as skipped until the owner adds it
    env:
      HUB_REFRESH: ${{ secrets.VERCEL_DEPLOY_HOOK != '' && 'on' || 'off' }}
    steps:
      - if: env.HUB_REFRESH == 'on'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # the parent too, for the same check Vercel's ignored build step makes
          fetch-depth: 2
      - if: env.HUB_REFRESH == 'on'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: env.HUB_REFRESH == 'on'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HUB_REFRESH == 'on'
        run: pnpm install --frozen-lockfile
      - name: Refresh hub-data
        if: env.HUB_REFRESH == 'on'
        env:
          HUB_GITHUB_TOKEN: ${{ github.token }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          DEPLOYED: https://loomvale.vercel.app/api/hub-data.json
        run: |
          if [ -z "$KV_REST_API_URL" ] || [ -z "$KV_REST_API_READ_ONLY_TOKEN" ]; then
            echo "::warning::hub-data not compared: the KV_REST_API_URL and KV_REST_API_READ_ONLY_TOKEN secrets are missing"
            exit 0
          fi
          pnpm hub:data --out "$RUNNER_TEMP/hub-built.json"
          if curl -fsS --retry 2 -o "$RUNNER_TEMP/hub-deployed.json" "$DEPLOYED"; then
            status=0
            pnpm --silent hub:same "$RUNNER_TEMP/hub-built.json" "$RUNNER_TEMP/hub-deployed.json" || status=$?
            [ "$status" -le 1 ] || exit "$status"
          else
            echo "hub-data changed: the deployed document could not be read"
            status=1
          fi
          [ "$status" -eq 1 ] || exit 0
          # vercel.json's ignoreCommand, which Vercel also runs for hook builds: when main's newest commit changes
          # only CREDITS.md, the hook build would be cancelled, so it is not fired and the run says why
          if git diff --quiet HEAD^ HEAD -- . ':(exclude)CREDITS.md'; then
            echo "::warning::hub-data not deployed: main's newest commit changes only CREDITS.md, so Vercel's ignored build step would cancel the hook build; the next commit to main deploys it"
            exit 0
          fi
          # a value that is not a Vercel hook address fails here, at once, without printing any of it
          case "$VERCEL_DEPLOY_HOOK" in
            https://api.vercel.com/*) ;;
            *)
              echo "::error::The VERCEL_DEPLOY_HOOK secret is not a Vercel deploy hook address (it must start with https://api.vercel.com/). Copy the address from the Vercel project's Settings > Git > Deploy Hooks, then run: gh secret set VERCEL_DEPLOY_HOOK --repo Bobikobi/GAME - and paste the value at the prompt."
              exit 1
              ;;
          esac
          curl -fsS --max-time 30 -X POST -o /dev/null "$VERCEL_DEPLOY_HOOK"
          echo "deploy hook fired"

  credits:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: loop
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm credits
      - name: Commit current credits
        run: |
          git diff --quiet -- CREDITS.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CREDITS.md
          git commit -m "Update credits"
          git push
