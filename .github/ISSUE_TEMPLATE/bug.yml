name: Something is broken
description: A bug in the game or in the creator tools.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        In the game, Menu > Report a problem fills most of this in for you, including your last actions.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Start a new game as the Forager
        2. Walk to the bridge without stones
        3. ...
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Pixel 8, Chrome 141
