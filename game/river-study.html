<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בדיקת נהר במנוע</title><style>body{height:100dvh;display:flex;flex-direction:column;margin:0;background:#17251e;color:#eee9d8;font:16px/1.5 system-ui}header{flex:none;padding:10px 16px}h1{font-size:22px;margin:0}p{margin:5px 0}button,select{font:inherit;background:#304d39;color:inherit;border:1px solid #92a383;padding:5px 12px;margin-left:8px}#game{flex:1;min-height:0;touch-action:none}canvas{display:block}#status{font-size:13px;color:#ccd5c1}</style><header><h1>בדיקת הנהר במנוע המשחק</h1><p>חצים / WASD, או לחיצה ממושכת בכיוון ההליכה. דמות קיימת לבדיקת קנה מידה.</p><label>מצב מים <select id="weather"><option value="calm">שקט</option><option value="windy" selected>גלי</option><option value="storm">סוער</option></select></label> <label>שיפוע ניסוי <select id="slope"><option value="0">מתון</option><option value="0.4" selected>בינוני</option><option value="1">תלול</option></select></label> <button id="wind">רוח ← החלפת כיוון</button><button id="water">עצירת מים</button><button id="zoom">קירוב ×2</button><details><summary>שכבות המים</summary><label><input type="checkbox" data-layer="bed" checked>קרקעית ורדודים</label> · <label><input type="checkbox" data-layer="reflection" checked>השתקפות הגדה</label> · <label><input type="checkbox" data-layer="surface" checked>אור על המים</label> · <label><input type="checkbox" data-layer="breakers" checked>גלים וקצף</label></details><span id="status">טוען…</span><p style="font-size:12px">אזור ניסוי מקומי בלבד: ללא שמירה, משימות או שינוי במפת הפתיחה. תגובה חזותית לצורת החוף. השיפוע ומזג האוויר נבחרים כאן ידנית; זו אינה סימולציית נוזלים או מזג האוויר של המשחק.</p></header><div id="game"></div><script type="module" src="/src/river-study.ts"></script></html>
