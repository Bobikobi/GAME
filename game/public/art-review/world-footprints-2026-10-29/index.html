<h1>עקבות בחול — 29.10.2026</h1>
<p><a href="../../world-study.html">ללכת בעולם</a> · <a href="../world-2026-10-29/index.html">החול וההליכה שאושרו</a></p>
<p>התוספת הבאה: הרגל משאירה עקבה בדריכה על החול. העקבות דועכות בארבעה שלבים ונעלמות אחרי 20 שניות. עמידה או תנועה חסומה אינן יוצרות עקבות.</p>
<figure><img src="desktop-footprints.png" alt="הדמות והעקבות שנותרו בחול אחרי הליכה ופניות"><figcaption>מחשב · עקבות בדריכה, מתחת לדמות ולצללים. אפשר להסתיר ולהחזיר אותן דרך „עקבות” בתצוגה ושכבות.</figcaption></figure>
<figure class="phone"><img src="phone-footprints.png" alt="עקבות בחול אחרי הליכה במגע בטלפון"><figcaption>טלפון · הליכה במגע עם העדפת תנועה מופחתת.</figcaption></figure>
<p>זו תוספת למעבדה המחוברת. הריצוף ותכנון המקום נשארים בסקירה הנפרדת שלהם.</p>
