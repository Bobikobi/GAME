# A new file in the host's nginx, never an edit of one that is already serving something else.
# Add it as its own site, test with `nginx -t`, then reload. It answers only its own name.
server {
    listen 80;
    server_name api.openfold.example;   # replace with the real name before the certificate step
    client_max_body_size 256k;          # a batch of movement reports is about 0.3 KB; nothing here is large

    # the container's healthcheck is for Docker, not for the world: it would tell a stranger whether the database is up
    location = /health { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # identity is the API's to decide: a header from outside never reaches it (dev-header mode reads it)
        proxy_set_header x-player-id "";
        # the country the sign-up's age limit is read from (COUNTRY_HEADER): set here and only here, so a value a
        # client sends never reaches the API. Blank until the GeoIP step of RUNBOOK step 6 swaps in the lookup.
        proxy_set_header X-Country "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
