# A new file in the host's nginx, never an edit of one that is already serving something else.
# Add it as its own site, test with `nginx -t`, then reload. It answers its own name.
#
# One name serves both the game and its API (finding 4 of the 27.10 review): the game's build is the static
# files under `root`, and the API's five paths are proxied, each exact, to the container on its loopback port.
# So the page, its fetches and the `__Host-` session cookie (SameSite=Lax) stay on one origin: no CORS, no
# cross-site cookie, and the address nginx sees is the player's own, so the limits below count the player.

# Sign-in is counted per client address before it reaches the API (finding 6 of the 27.10 review): a normal
# sign-in is about six requests, so 10 a minute with a burst of 20 never touches a player and stops a flood.
# The API counts the costly starts again on its own (a mail sent, a flow row written).
limit_req_zone $binary_remote_addr zone=openfold_auth:10m rate=10r/m;

# The sign-in paths are logged without their query string and without the Referer: an OAuth callback carries
# a code and a state in its query, and a link mailed before the token moved to the fragment carries the token.
log_format openfold_auth '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name play.loomvale.example;  # replace with the real name before the certificate step
    root /var/www/loomvale;             # the game's build (RUNBOOK step 3): nginx's user must be able to read it
    index index.html;
    client_max_body_size 256k;          # a batch of movement reports is about 0.3 KB; nothing here is large

    # set here for every proxied location below (a location that sets none of its own inherits these)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # identity is the API's to decide: a header from outside never reaches it (dev-header mode reads it)
    proxy_set_header x-player-id "";
    # the country the sign-up's age limit is read from (COUNTRY_HEADER): set here and only here, so a value a
    # client sends never reaches the API. Blank until the GeoIP step of RUNBOOK step 6 swaps in the lookup.
    proxy_set_header X-Country "";
    # the client's address the API's sign-in limits count by (CLIENT_ADDRESS_HEADER=X-Real-IP): set, never
    # passed through, so a client cannot name another address. X-Forwarded-For appends to what the client sent.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # the container's healthcheck is for Docker, not for the world: it would tell a stranger whether the database is up
    location = /health { return 404; }

    # the API's paths (api.ts answers these and /auth/*, nothing else), each exact: /state.html is a file, not the API
    location = /session { proxy_pass http://127.0.0.1:8710; }
    location = /state { proxy_pass http://127.0.0.1:8710; }
    location = /action { proxy_pass http://127.0.0.1:8710; }
    location = /moves { proxy_pass http://127.0.0.1:8710; }

    location /auth/ {
        limit_req zone=openfold_auth burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/access.log openfold_auth;
        proxy_pass http://127.0.0.1:8710;
    }

    # the build's hashed files: a new build has new names, so a browser may keep these for a year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the game: index.html, the favicon and the fonts, revalidated on every load so a new build shows at once
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
}
