<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Animation production</title>
<style>
:root{--bg:#14161a;--panel:#1d2025;--line:#2d3139;--ink:#e8e6df;--dim:#9aa0a8;--ok:#6fcf8a;--bad:#e6735f;--warn:#e0b24f;--acc:#7aa7ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
#app{width:1440px;height:900px;margin:0 auto;display:flex;flex-direction:column;padding:10px 16px 8px;gap:6px}
header{display:flex;align-items:center;gap:16px;height:30px}h1{font-size:16px;margin:0;font-weight:600}header .sp{flex:1}
label.tg{display:flex;gap:6px;align-items:center;color:var(--dim);cursor:pointer;user-select:none}
.row{display:flex;gap:6px;align-items:center;height:32px}.row .g{width:70px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.row button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer}
.row button.on{border-color:var(--acc);background:#243049}.row button.none{opacity:.38}.row button small{margin-left:5px;font-size:11px}
.pass{color:var(--ok)}.fail{color:var(--bad)}.part{color:var(--warn)}.dim{color:var(--dim)}
main{flex:1;display:flex;gap:12px;min-height:0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.col h2{font-size:14px;margin:0;display:flex;justify-content:space-between;align-items:baseline}.col h2 span{color:var(--dim);font-weight:400;font-size:12px}
.stage{background:#000;border-radius:4px;display:flex;align-items:center;justify-content:center;width:384px;height:384px}canvas{image-rendering:pixelated;display:block}
.gates{display:grid;grid-template-columns:96px 1fr;gap:2px 8px;font-size:12px}.gates b{color:var(--dim);font-weight:500}
.verdict{font-weight:600;font-size:14px}.note{color:var(--dim);font-size:12px}
.strip{display:flex;gap:2px;flex-wrap:wrap;overflow:hidden}.strip canvas{border:1px solid var(--line);background:#2b3a26}
</style></head><body><div id="app">
<header><h1>Animation production: fight and work motions of the three races</h1><span class="sp"></span>
<label class="tg"><input type="checkbox" id="halo" checked> halo layer (skeleton black, elf white, human none; the page draws it, the frames never carry it)</label></header>
<div class="row" id="r-race"></div><div class="row" id="r-view"></div><div class="row" id="r-motion"></div><div class="row" id="r-take"></div>
<main id="main"></main></div>
<script>/*DATA*/
const RACES=['skeleton','human','elf'],VIEWS=['left','front','back'],MOTIONS=['strike','guard','dodge','hit','fell','quarry','fish','pickup'];
const LABEL={strike:'Strike',guard:'Guard',dodge:'Dodge',hit:'Hit',fell:'Fell',quarry:'Quarry',fish:'Fish',pickup:'Pick-up'};
const HALO_COL={skeleton:[0,0,0],elf:[255,255,255],human:null};
const $=s=>document.querySelector(s);let sel={race:'skeleton',view:'left',motion:'strike',take:0};
const IMG={};function img(src){if(!IMG[src]){const i=new Image();i.src=src;IMG[src]=i}return IMG[src]}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
const rows=(r,v,m)=>CLIPS.filter(c=>c.race===r&&c.view===v&&c.motion===m);
function cls(v){v=v||'';return v.startsWith('PASS')?'pass':v.startsWith('parked')||v.startsWith('FAIL')?'fail':'part'}
function best(list){return list.find(c=>(c.verdict||'').startsWith('PASS'))||list[0]}
function buttons(id,items,key,labelf){const r=$(id);r.innerHTML='';r.appendChild(el('span','g',key));items.forEach(it=>{
  const has=key==='race'?CLIPS.some(c=>c.race===it):key==='view'?CLIPS.some(c=>c.race===sel.race&&c.view===it):CLIPS.some(c=>c.race===sel.race&&c.view===sel.view&&c.motion===it);
  const b=el('button',(sel[key]===it?'on ':'')+(has?'':'none'),labelf(it));b.onclick=()=>{sel[key]=it;sel.take=0;if(key!=='motion')fix();draw()};r.appendChild(b)})}
function fix(){if(!rows(sel.race,sel.view,sel.motion).length){const m=MOTIONS.find(m=>rows(sel.race,sel.view,m).length);if(m)sel.motion=m}}
let stop=()=>{};
function chip(c){const v=c.verdict||'';const k=cls(v);return '<small class="'+k+'">'+(k==='pass'?'pass':k==='fail'?'parked':'part')+'</small>'}
function draw(){stop();buttons('#r-race',RACES,'race',x=>x[0].toUpperCase()+x.slice(1));buttons('#r-view',VIEWS,'view',x=>x[0].toUpperCase()+x.slice(1));
  buttons('#r-motion',MOTIONS,'motion',m=>LABEL[m]+(rows(sel.race,sel.view,m).length?chip(best(rows(sel.race,sel.view,m))):''));
  const list=rows(sel.race,sel.view,sel.motion);const t=$('#r-take');t.innerHTML='';t.appendChild(el('span','g','take'));
  list.forEach((c,i)=>{const b=el('button',i===sel.take?'on':'','Route '+c.route+(c.variant?' '+c.variant:'')+(c.clip?'':' (no clip)'));b.onclick=()=>{sel.take=i;draw()};t.appendChild(b)});
  const m=$('#main');m.innerHTML='';const c=list[sel.take];
  if(!c){m.appendChild(el('div','col','<span class="dim">Nothing made for this race, view and motion yet.</span>'));return}
  const A=el('div','col');A.appendChild(el('h2','',LABEL[c.motion]+' <span>'+(c.clip?c.frames+' frames, '+c.ms_per_frame+' ms, '+(c.loops?'loops':'plays once'):'no clip')+'</span>'));
  const st=el('div','stage');const cv=document.createElement('canvas');cv.width=cv.height=384;st.appendChild(cv);A.appendChild(st);m.appendChild(A);
  const B=el('div','col');B.appendChild(el('h2','','Kept stance <span>'+c.race+', '+c.view+'</span>'));const s2=el('div','stage');const cv2=document.createElement('canvas');cv2.width=cv2.height=384;s2.appendChild(cv2);B.appendChild(s2);
  B.appendChild(el('div','note','The kept sprite is never redrawn. Height '+(c.gates?c.gates.c_stance_height:'')+' px.'));m.appendChild(B);
  m.appendChild(info(c));stop=run(cv,cv2,c)}
function info(c){const C=el('div','col');C.style.flex='1';const g=c.gates||{};
  C.appendChild(el('div','verdict '+cls(c.verdict),c.verdict||'unread'));
  if(c.clip){const e=c.eye||{};const yn=v=>v===true?'yes':v===false?'NO':'n/a';
   C.appendChild(Object.assign(el('div','gates'),{innerHTML:
   '<b>a feet</b><span class="'+(g.gate_a==='PASS'?'pass':'fail')+'">spread '+g.a_raw_spread+' px raw, '+g.a_spread_after+' after re-snap, bob '+g.a_bob_px+' px: '+g.gate_a+'</span>'+
   '<b>b identity</b><span class="'+(g.gate_b==='PASS'?'pass':'fail')+'">worst frame '+g.b_identity_max+' (mean '+g.b_identity_mean+'): '+g.gate_b+'</span>'+
   '<b>c size</b><span class="'+(g.gate_c==='PASS'?'pass':'fail')+'">stance '+g.c_stance_height+' px, lowest '+g.c_lowest_height+', highest '+g.c_highest_height+' px, upright off by '+g.c_upright_dev_max+' px: '+g.gate_c+'</span>'+
   '<b>d eye</b><span>planted foot '+yn(e.planted_foot)+', weight with foot '+yn(e.weight_with_foot)+', identity '+yn(e.identity)+'</span>'+
   '<b>e loop</b><span class="'+(g.gate_e==='PASS'?'pass':g.gate_e==='FAIL'?'fail':'dim')+'">'+(g.gate_e==='n/a'?'not a loop':'close '+g.e_close+' vs largest step '+g.e_step_max+': '+g.gate_e)+'</span>'+
   '<b>f drawn</b><span>'+(c.effects||(c.flags_for_the_eye&&c.flags_for_the_eye.length?'frames flagged for the eye: '+c.flags_for_the_eye.map(f=>f.frame).join(', '):'nothing flagged'))+'</span>'+
   '<b>declared</b><span>bend '+JSON.stringify(c.declared.bend)+' airborne '+JSON.stringify(c.declared.airborne)+' effect '+JSON.stringify(c.declared.effect_frames)+'</span>'+
   '<b>cost</b><span>'+(c.generations==null?'n/a':c.generations+' generations')+', '+(c.tries||'?')+' tries, jobs '+(c.jobs||[]).join(' ')+' seeds '+(c.seeds||[]).join(' ')+'</span>'}));}
  if(c.parked)C.appendChild(el('div','note','<b>Parked:</b> '+c.parked));if(c.note)C.appendChild(el('div','note',c.note));
  if(c.clip&&c.race!=='human'){const hc=c.race==='skeleton'?'black':'white';C.appendChild(el('div','note','Halo: '+hc+(c.race==='elf'?', numbers borrowed from the skeleton, not judged':', measured on the owner GIFs')+'. A layer of the page, not of the frames.'))}
  return C}
function dist(mask){const W=128,INF=1e9,d=new Float32Array(W*W);for(let i=0;i<W*W;i++)d[i]=mask[i]?0:INF;
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){let v=d[y*W+x];if(!v)continue;if(x)v=Math.min(v,d[y*W+x-1]+1);if(y){v=Math.min(v,d[(y-1)*W+x]+1);if(x)v=Math.min(v,d[(y-1)*W+x-1]+1.414);if(x<W-1)v=Math.min(v,d[(y-1)*W+x+1]+1.414)}d[y*W+x]=v}
  for(let y=W-1;y>=0;y--)for(let x=W-1;x>=0;x--){let v=d[y*W+x];if(!v)continue;if(x<W-1)v=Math.min(v,d[y*W+x+1]+1);if(y<W-1){v=Math.min(v,d[(y+1)*W+x]+1);if(x<W-1)v=Math.min(v,d[(y+1)*W+x+1]+1.414);if(x)v=Math.min(v,d[(y+1)*W+x-1]+1.414)}d[y*W+x]=v}return d}
function haloLayers(frame,col){const k=document.createElement('canvas');k.width=k.height=128;const x=k.getContext('2d');x.drawImage(frame,0,0);const id=x.getImageData(0,0,128,128).data;const mask=new Uint8Array(128*128);for(let i=0;i<mask.length;i++)mask[i]=id[i*4+3]>0?1:0;
  const d=dist(mask),out=[];[0.88,1.12].forEach(kk=>{const c=document.createElement('canvas');c.width=c.height=128;const cx=c.getContext('2d'),o=cx.createImageData(128,128);
   for(let i=0;i<mask.length;i++){const a=mask[i]?0:HALO.peak*kk*Math.exp(-Math.max(d[i]-0.5,0)/(HALO.tau*kk));o.data[i*4]=col[0];o.data[i*4+1]=col[1];o.data[i*4+2]=col[2];o.data[i*4+3]=a*255}cx.putImageData(o,0,0);out.push(c)});return out}
function run(cv,cv2,c){let alive=true;const ctx=cv.getContext('2d'),c2=cv2.getContext('2d');const col=HALO_COL[c.race];
  const fr=[];const sheet=c.sheet?img(c.sheet):null;const st=img(STANCES[c.race+'/'+c.view]);const cache=[];
  function frame(i){if(!fr[i]){const k=document.createElement('canvas');k.width=k.height=128;k.getContext('2d').drawImage(sheet,i*128,0,128,128,0,0,128,128);fr[i]=k}return fr[i]}
  function bg(x){x.imageSmoothingEnabled=false;x.fillStyle='#46603a';x.fillRect(0,0,384,384)}
  (function tick(now){if(!alive)return;bg(c2);if(st.complete){if(col&&$('#halo').checked){if(!cache.st)cache.st=haloLayers(st,col);const mix=.5+.5*Math.sin(now/HALO.period_ms*2*Math.PI);c2.imageSmoothingEnabled=true;c2.globalAlpha=1-mix;c2.drawImage(cache.st[0],0,0,384,384);c2.globalAlpha=mix;c2.drawImage(cache.st[1],0,0,384,384);c2.globalAlpha=1;c2.imageSmoothingEnabled=false}c2.drawImage(st,0,0,384,384)}
   if(sheet&&sheet.complete){const i=Math.floor(now/c.ms_per_frame)%c.n;bg(ctx);const f=frame(i);
    if(col&&$('#halo').checked){if(!cache[i])cache[i]=haloLayers(f,col);const mix=.5+.5*Math.sin(now/HALO.period_ms*2*Math.PI);ctx.imageSmoothingEnabled=true;ctx.globalAlpha=1-mix;ctx.drawImage(cache[i][0],0,0,384,384);ctx.globalAlpha=mix;ctx.drawImage(cache[i][1],0,0,384,384);ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false}
    ctx.drawImage(f,0,0,384,384)}else{bg(ctx);ctx.fillStyle='#9aa0a8';ctx.font='14px sans-serif';ctx.fillText('no clip',150,190)}
   requestAnimationFrame(tick)})(0);return()=>{alive=false}}
fix();draw();
</script></body></html>
